# GridLens Report Data Contract
#
# Stable interface between the GridLens processing layer, the PowerFactory
# IntReport bridge and the Stimulsoft master template.
#
#   Data Processing -> IntReport Scripted Data Sources -> Stimulsoft -> PDF
#
# This is the offline processing library's source of truth and is read by
# gridlens.contracts.loader. The self-contained active-model publisher declares
# its MRT-facing table fields directly in powerfactory/gridlens_report.py.
#
# Field names are a published interface. Do not rename without a version bump.
#
# Types:
#   string   - rendered verbatim; timestamps are pre-formatted strings so that
#              rendering never depends on locale or engine date handling
#   integer  - whole numbers (flags, ranks)
#   number   - floating point measurements
#
# Units:
#   loading  - percent, stored as the bare number (91.4 means 91.4 %)
#   voltage  - per unit (p.u.) unless the row's unit field says otherwise
#   delta    - same unit as the compared metric; loading deltas are percentage
#              points (%-Pkt.)

version: "2.0"
template_name: "MASTER_GRIDLENS"
template_version: "2.0.0"

data_sources:

  # ---------------------------------------------------------------------------
  - name: ScriptedReportMeta
    cardinality: single_row
    description: >
      Study, model and versioning information. Rendered on the cover page and in
      the running page header and footer.
    fields:
      - { name: study_id,              type: string, required: true }
      - { name: study_name,            type: string, required: true }
      - { name: study_description,     type: string, required: false }
      - { name: model_name,            type: string, required: true }
      - { name: model_version,         type: string, required: true }
      - { name: simulation_start,      type: string, required: true }
      - { name: simulation_end,        type: string, required: true }
      - { name: simulation_time_step,  type: string, required: true }
      - { name: generation_date,       type: string, required: true }
      - { name: template_name,         type: string, required: true }
      - { name: template_version,      type: string, required: true }
      - { name: data_contract_version, type: string, required: true }
      - { name: result_name,          type: string, required: true }
      - { name: assessment_scope,     type: string, required: true }
      - { name: assessment_status,    type: string, required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedModelQuality
    cardinality: multi_row
    description: >
      QA results produced by an upstream module. GridLens only displays them and
      performs no quality checking and no pass/fail interpretation of its own.
    fields:
      - { name: check_id,         type: string, required: true }
      - { name: check_name,       type: string, required: true }
      - { name: status,           type: string, required: true }
      - { name: message,          type: string, required: false }
      - { name: affected_element, type: string, required: false }

  # ---------------------------------------------------------------------------
  - name: ScriptedScenarios
    cardinality: multi_row
    description: >
      The investigated scenarios. Exactly one row must carry is_reference = 1.
    fields:
      - { name: scenario_id,       type: string,  required: true }
      - { name: scenario_name,     type: string,  required: true }
      - { name: is_reference,      type: integer, required: true }
      - { name: description,       type: string,  required: false }
      - { name: simulation_status, type: string,  required: true }
      - { name: simulation_start,  type: string,  required: true }
      - { name: simulation_end,    type: string,  required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedOutages
    cardinality: multi_row
    description: >
      Switching actions per scenario, as delivered by the upstream outage module.
      GridLens neither imports nor derives outages.
    fields:
      - { name: scenario_id,  type: string, required: true }
      - { name: outage_id,    type: string, required: true }
      - { name: element_id,   type: string, required: true }
      - { name: element_name, type: string, required: true }
      - { name: element_type, type: string, required: true }
      - { name: start_time,   type: string, required: true }
      - { name: end_time,     type: string, required: true }
      - { name: action,       type: string, required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedScenarioMatrix
    cardinality: multi_row
    description: >
      Long-format element/scenario service state. One row per element and
      scenario, so the number of scenarios is never fixed by the template.
      status_label is the display form of is_out_of_service.
    fields:
      - { name: element_id,        type: string,  required: true }
      - { name: element_name,      type: string,  required: true }
      - { name: element_type,      type: string,  required: true }
      - { name: scenario_id,       type: string,  required: true }
      - { name: is_out_of_service, type: integer, required: true }
      - { name: status_label,      type: string,  required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedLineStatistics
    cardinality: multi_row
    description: Per scenario and line loading statistics in percent.
    fields:
      - { name: scenario_id,           type: string, required: true }
      - { name: element_id,            type: string, required: true }
      - { name: element_name,          type: string, required: true }
      - { name: voltage_level,         type: string, required: false }
      - { name: min_loading,           type: number, required: true }
      - { name: max_loading,           type: number, required: true }
      - { name: mean_loading,          type: number, required: true }
      - { name: p95_loading,           type: number, required: true }
      - { name: time_of_min_loading,   type: string, required: true }
      - { name: time_of_max_loading,   type: string, required: true }
      - { name: reference_max_loading, type: number, required: false }
      - { name: delta_max_loading,     type: number, required: false }

  # ---------------------------------------------------------------------------
  - name: ScriptedTransformerStatistics
    cardinality: multi_row
    description: Per scenario and transformer loading statistics in percent.
    fields:
      - { name: scenario_id,           type: string, required: true }
      - { name: element_id,            type: string, required: true }
      - { name: element_name,          type: string, required: true }
      - { name: voltage_level,         type: string, required: false }
      - { name: min_loading,           type: number, required: true }
      - { name: max_loading,           type: number, required: true }
      - { name: mean_loading,          type: number, required: true }
      - { name: p95_loading,           type: number, required: true }
      - { name: time_of_max_loading,   type: string, required: true }
      - { name: reference_max_loading, type: number, required: false }
      - { name: delta_max_loading,     type: number, required: false }

  # ---------------------------------------------------------------------------
  - name: ScriptedVoltageStatistics
    cardinality: multi_row
    description: Per scenario and busbar voltage statistics, per unit by default.
    fields:
      - { name: scenario_id,             type: string, required: true }
      - { name: element_id,              type: string, required: true }
      - { name: element_name,            type: string, required: true }
      - { name: voltage_level,           type: string, required: false }
      - { name: min_voltage,             type: number, required: true }
      - { name: max_voltage,             type: number, required: true }
      - { name: mean_voltage,            type: number, required: true }
      - { name: time_of_min_voltage,     type: string, required: true }
      - { name: time_of_max_voltage,     type: string, required: true }
      - { name: reference_min_voltage,   type: number, required: false }
      - { name: reference_max_voltage,   type: number, required: false }
      - { name: delta_min_voltage,       type: number, required: false }
      - { name: delta_max_voltage,       type: number, required: false }

  # ---------------------------------------------------------------------------
  - name: ScriptedLineLoadingBars
    cardinality: multi_row
    description: Top line-loading values prepared for the production bar chart.
    fields:
      - { name: rank,          type: integer, required: true }
      - { name: scenario_id,   type: string,  required: true }
      - { name: element_id,    type: string,  required: true }
      - { name: element_name,  type: string,  required: true }
      - { name: voltage_level, type: string,  required: false }
      - { name: max_loading,   type: number,  required: true }
      - { name: unit,          type: string,  required: true }
      - { name: event_time,    type: string,  required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedTransformerLoadingBars
    cardinality: multi_row
    description: Top transformer-loading values prepared for the production bar chart.
    fields:
      - { name: rank,          type: integer, required: true }
      - { name: scenario_id,   type: string,  required: true }
      - { name: element_id,    type: string,  required: true }
      - { name: element_name,  type: string,  required: true }
      - { name: voltage_level, type: string,  required: false }
      - { name: max_loading,   type: number,  required: true }
      - { name: unit,          type: string,  required: true }
      - { name: event_time,    type: string,  required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedVoltageMagnitudeBars
    cardinality: multi_row
    description: Top busbars by deviation from nominal voltage for the magnitude chart.
    fields:
      - { name: rank,          type: integer, required: true }
      - { name: scenario_id,   type: string,  required: true }
      - { name: element_id,    type: string,  required: true }
      - { name: element_name,  type: string,  required: true }
      - { name: voltage_level, type: string,  required: false }
      - { name: min_voltage,   type: number,  required: true }
      - { name: max_voltage,   type: number,  required: true }
      - { name: mean_voltage,  type: number,  required: true }
      - { name: deviation,     type: number,  required: true }
      - { name: status_label,  type: string,  required: true }
      - { name: unit,          type: string,  required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedVoltageAngleBars
    cardinality: multi_row
    description: Top busbars by absolute voltage angle for the informational angle chart.
    fields:
      - { name: rank,          type: integer, required: true }
      - { name: scenario_id,   type: string,  required: true }
      - { name: element_id,    type: string,  required: true }
      - { name: element_name,  type: string,  required: true }
      - { name: voltage_level, type: string,  required: false }
      - { name: min_angle,     type: number,  required: true }
      - { name: max_angle,     type: number,  required: true }
      - { name: mean_angle,    type: number,  required: true }
      - { name: max_abs_angle, type: number,  required: true }
      - { name: angle_span,    type: number,  required: true }
      - { name: event_time,    type: string,  required: true }
      - { name: unit,          type: string,  required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedReferenceComparison
    cardinality: multi_row
    description: >
      Scenario versus reference per element and variable. The reference scenario
      itself is not compared against itself and therefore not listed.
    fields:
      - { name: scenario_id,    type: string, required: true }
      - { name: element_id,     type: string, required: true }
      - { name: element_name,   type: string, required: true }
      - { name: element_type,   type: string, required: true }
      - { name: variable,       type: string, required: true }
      - { name: unit,           type: string, required: true }
      - { name: reference_min,  type: number, required: true }
      - { name: scenario_min,   type: number, required: true }
      - { name: delta_min,      type: number, required: true }
      - { name: reference_max,  type: number, required: true }
      - { name: scenario_max,   type: number, required: true }
      - { name: delta_max,      type: number, required: true }
      - { name: reference_mean, type: number, required: true }
      - { name: scenario_mean,  type: number, required: true }
      - { name: delta_mean,     type: number, required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedScenarioComparison
    cardinality: multi_row
    description: >
      Long format on purpose: one row per metric and scenario. A wide layout
      would fix the number of scenario columns in the template, which must stay
      dynamic. metric_key groups the rows, scenario_id spreads them.
    fields:
      - { name: metric_key,    type: string, required: true }
      - { name: metric_name,   type: string, required: true }
      - { name: unit,          type: string, required: true }
      - { name: scenario_id,   type: string, required: true }
      - { name: metric_value,  type: number, required: true }
      - { name: element_id,    type: string, required: false }
      - { name: element_name,  type: string, required: false }

  # ---------------------------------------------------------------------------
  - name: ScriptedRankings
    cardinality: multi_row
    description: >
      Pre-sorted rankings. ranking_type selects the list, rank is 1-based.
      The number of entries per list is configured in the processing layer.
    fields:
      - { name: ranking_type,    type: string,  required: true }
      - { name: rank,            type: integer, required: true }
      - { name: scenario_id,     type: string,  required: true }
      - { name: element_id,      type: string,  required: true }
      - { name: element_name,    type: string,  required: true }
      - { name: element_type,    type: string,  required: true }
      - { name: metric_name,     type: string,  required: true }
      - { name: metric_value,    type: number,  required: true }
      - { name: unit,            type: string,  required: true }
      - { name: reference_value, type: number,  required: false }
      - { name: delta_value,     type: number,  required: false }
      - { name: event_time,      type: string,  required: false }

  # ---------------------------------------------------------------------------
  - name: ScriptedRelevantTimePoints
    cardinality: multi_row
    description: >
      Time points worth inspecting, with a factual reason code. These are
      informative only and are never labelled critical or dangerous.
    fields:
      - { name: timestamp,    type: string, required: true }
      - { name: scenario_id,  type: string, required: true }
      - { name: reason,       type: string, required: true }
      - { name: element_id,   type: string, required: false }
      - { name: element_name, type: string, required: false }
      - { name: metric_name,  type: string, required: false }
      - { name: metric_value, type: number, required: false }
      - { name: unit,         type: string, required: false }

  # ---------------------------------------------------------------------------
  - name: ScriptedPlots
    cardinality: multi_row
    description: >
      One row per chart the report should draw - the master side of the plot
      data. The processing layer decides which time series are worth plotting;
      the template never makes that choice.

      The report renders one chart per row here, joined to ScriptedPlotData on
      plot_id. Without this master list a chart could not be restricted to its
      own series: a chart bound directly to the flat point table draws every
      plot at once.
    fields:
      - { name: plot_id,      type: string, required: true }
      - { name: plot_title,   type: string, required: true }
      - { name: scenario_id,  type: string, required: true }
      - { name: element_id,   type: string, required: true }
      - { name: element_name, type: string, required: true }
      - { name: variable,     type: string, required: true }
      - { name: unit,         type: string, required: true }

  # ---------------------------------------------------------------------------
  - name: ScriptedPlotData
    cardinality: multi_row
    description: >
      The sample points of the selected time series, joined to ScriptedPlots on
      plot_id. series_role distinguishes the reference curve from the scenario
      curve, so one chart can show both without the template naming either.
    fields:
      - { name: plot_id,     type: string, required: true }
      - { name: scenario_id, type: string, required: true }
      - { name: series_role, type: string, required: true }
      - { name: timestamp,   type: number, required: true }
      - { name: value,       type: number, required: true }
