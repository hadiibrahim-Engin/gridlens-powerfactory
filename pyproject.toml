[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlens"
version = "2.0.0"
description = "GridLens - preparation and presentation of pre-computed PowerFactory results"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["gridlens*"]
exclude = ["gridlens.tests*", "gridlens.docs*"]

[tool.setuptools.package-data]
"gridlens.contracts" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["gridlens/tests"]
pythonpath = ["."]
